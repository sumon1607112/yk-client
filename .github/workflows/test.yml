name: Azure Static Web Apps CI/CD - Test

on:
  push:
    branches:
      - test
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - test

# ─── Change these in one place if paths ever move ───
env:
  NODE_VERSION: "22"
  COMBINED_OUTPUT: "dist/combined"
  AUTH_REMOTE_FOLDER: "auth-remote"
  SHELL_BUILD_CONFIG: "testing"
  AUTH_BUILD_CONFIG: "testing"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job (Test)
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build auth remote
        run: npx ng build auth --configuration=${{ env.AUTH_BUILD_CONFIG }}

      - name: Build shell
        run: npx ng build shell --configuration=${{ env.SHELL_BUILD_CONFIG }}

      - name: Resolve output paths
        id: paths
        run: |
          SHELL_OUT=$(node -e "
            const cfg = require('./angular.json');
            const out = cfg.projects.shell?.architect?.esbuild?.options?.outputPath || 'dist/shell';
            console.log(out + '/browser');
          ")
          AUTH_OUT=$(node -e "
            const cfg = require('./angular.json');
            const out = cfg.projects.auth?.architect?.esbuild?.options?.outputPath || 'dist/auth';
            console.log(out + '/browser');
          ")
          echo "shell_out=$SHELL_OUT" >> $GITHUB_OUTPUT
          echo "auth_out=$AUTH_OUT" >> $GITHUB_OUTPUT

      - name: Validate build outputs
        run: |
          SHELL_OUT="${{ steps.paths.outputs.shell_out }}"
          AUTH_OUT="${{ steps.paths.outputs.auth_out }}"

          ERROR=0

          if [ ! -d "$SHELL_OUT" ]; then
            echo "::error::Shell build output not found at '$SHELL_OUT'. Check outputPath in angular.json or build logs above."
            ERROR=1
          else
            echo "✅ Shell output found at: $SHELL_OUT ($(find $SHELL_OUT -type f | wc -l) files)"
          fi

          if [ ! -d "$AUTH_OUT" ]; then
            echo "::error::Auth build output not found at '$AUTH_OUT'. Check outputPath in angular.json or build logs above."
            ERROR=1
          else
            echo "✅ Auth output found at: $AUTH_OUT ($(find $AUTH_OUT -type f | wc -l) files)"
          fi

          if [ ! -f "staticwebapp.config.json" ]; then
            echo "::warning::staticwebapp.config.json not found in repo root. Deployment may not route correctly."
          fi

          if [ ! -f ".swaignore" ]; then
            echo "::warning::.swaignore not found in repo root."
          fi

          if [ $ERROR -eq 1 ]; then
            exit 1
          fi

      - name: Combine builds
        run: |
          SHELL_OUT="${{ steps.paths.outputs.shell_out }}"
          AUTH_OUT="${{ steps.paths.outputs.auth_out }}"

          mkdir -p ${{ env.COMBINED_OUTPUT }}
          cp -r $SHELL_OUT/* ${{ env.COMBINED_OUTPUT }}/
          mkdir -p ${{ env.COMBINED_OUTPUT }}/${{ env.AUTH_REMOTE_FOLDER }}
          cp -r $AUTH_OUT/* ${{ env.COMBINED_OUTPUT }}/${{ env.AUTH_REMOTE_FOLDER }}/
          [ -f staticwebapp.config.json ] && cp staticwebapp.config.json ${{ env.COMBINED_OUTPUT }}/
          [ -f .swaignore ] && cp .swaignore ${{ env.COMBINED_OUTPUT }}/

          echo "📦 Combined output ready at ${{ env.COMBINED_OUTPUT }} ($(find ${{ env.COMBINED_OUTPUT }} -type f | wc -l) files total)"

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_TEST }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ${{ env.COMBINED_OUTPUT }}
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job (Test)
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_TEST }}
          action: "close"